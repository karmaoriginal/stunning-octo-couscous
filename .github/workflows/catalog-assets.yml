name: Ensure CC0 Catalog Assets

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  publish-assets:
    name: Publish CC0 Assets to Release catalog-v1
    runs-on: ubuntu-latest
    steps:
      - name: Check existing catalog-v1 assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api "repos/${{ github.repository }}/releases/tags/catalog-v1" --jq '.assets | length' 2>/dev/null || echo 0)
          echo "asset_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Existing catalog-v1 assets: $COUNT"

      - name: Checkout repository
        if: fromJSON(steps.check.outputs.asset_count) < 27
        uses: actions/checkout@v4

      - name: Set up Python
        if: fromJSON(steps.check.outputs.asset_count) < 27
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and upload CC0 1.0 assets
        if: fromJSON(steps.check.outputs.asset_count) < 27
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --quiet pillow numpy imageio-ffmpeg
          python scripts/generate_cc0_catalog.py --docs-dir /tmp/generated_docs --assets-dir /tmp/catalog_release_assets --app-fallback /tmp/generated_fallback.json
          if ! gh release view catalog-v1 >/dev/null 2>&1; then
            gh release create catalog-v1 --target "${{ github.sha }}" --title "Kromiv CC0 Catalog Assets v1" --notes "Initial CC0 1.0 royalty-free static WebP and looping MP4 wallpaper assets for docs/catalog.json."
          fi
          gh release upload catalog-v1 /tmp/catalog_release_assets/* --clobber
          jq -n --arg sha "${{ github.sha }}" --arg cat "$(cat /tmp/generated_docs/catalog.json)" '{
            name: "kromiv-catalog-manifest",
            head_sha: $sha,
            status: "completed",
            conclusion: "success",
            output: {
              title: "Generated catalog-v1 asset manifest",
              summary: "SHA-256 and file sizes of uploaded catalog-v1 assets",
              text: $cat
            }
          }' | gh api "repos/${{ github.repository }}/check-runs" --method POST --input -
