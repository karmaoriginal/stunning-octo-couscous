name: Build Kromiv Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    name: Build Release APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle & cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing keystore
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="${{ runner.temp }}/kromiv-release.jks"
          if [ -n "$SECRET_KEYSTORE_BASE64" ]; then
            echo "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "KROMIV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KROMIV_KEYSTORE_PASSWORD=${SECRET_KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KROMIV_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "KROMIV_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "Using repository signing secrets."
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass kromivRelease123 \
              -alias kromiv \
              -keypass kromivRelease123 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Kromiv, OU=Android, O=Kromiv, L=Internet, S=Net, C=MX"
            echo "KROMIV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "KROMIV_KEYSTORE_PASSWORD=kromivRelease123" >> "$GITHUB_ENV"
            echo "KROMIV_KEY_ALIAS=kromiv" >> "$GITHUB_ENV"
            echo "KROMIV_KEY_PASSWORD=kromivRelease123" >> "$GITHUB_ENV"
            echo "Generated ephemeral release signing keystore."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests & build Release APKs
        run: |
          set -o pipefail
          ./gradlew test assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload build.log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Inspect APK sizes
        if: success()
        run: |
          ls -lh app/build/outputs/apk/release/ || true

      - name: Publish build diagnostics via GitHub API
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            APK_LIST=$(ls -lh app/build/outputs/apk/release/*.apk 2>/dev/null || echo "No APKs found")
            SUMMARY_TEXT=$(printf "Build & unit tests succeeded.\n\n%s" "$APK_LIST")
            CONCL="success"
            TITLE="Build succeeded — Release APKs & unit tests"
          else
            if [ -f build.log ]; then
              SUMMARY_TEXT=$(grep -v -E '^\s+at (org\.gradle|java\.|org\.jetbrains\.kotlin\.compilerRunner|org\.jetbrains\.kotlin\.gradle)' build.log | tail -n 140)
            else
              SUMMARY_TEXT="build.log not found"
            fi
            CONCL="failure"
            TITLE="Gradle build.log excerpt"
          fi
          jq -n --arg sha "${{ github.sha }}" --arg txt "$SUMMARY_TEXT" --arg concl "$CONCL" --arg title "$TITLE" '{
            name: "kromiv-build-diagnostics",
            head_sha: $sha,
            status: "completed",
            conclusion: $concl,
            output: {
              title: $title,
              summary: $title,
              text: ("```text\n" + $txt + "\n```")
            }
          }' | gh api "repos/${{ github.repository }}/check-runs" --method POST --input - || true

      - name: Upload Release APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kromiv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
